<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>For Winny電子琴~by Dustin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: -webkit-fill-available;
            height: 100%;
            height: 100dvh;
            touch-action: pan-x pan-y;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            margin: 0;
            background-color: #090d16;
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.15;
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            color: #f8fafc;
            touch-action: pan-x pan-y;
            overflow-x: hidden;
            overflow-y: auto;
            padding-top: max(3px, var(--safe-top));
            padding-bottom: max(3px, var(--safe-bottom));
            padding-left: max(3px, var(--safe-left));
            padding-right: max(3px, var(--safe-right));
            justify-content: flex-start;
        }

        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

        .wood-trim {
            background: repeating-linear-gradient(90deg, #2a1409 0px, #3a1c0d 4px, #241006 8px, #42200f 14px);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .synth-chassis {
            background: linear-gradient(180deg, #1f2937 0%, #111827 40%, #0b0f19 100%);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .felt-strip {
            height: 4px;
            background: linear-gradient(180deg, #7f1d1d 0%, #dc2626 50%, #450a0a 100%);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            flex-shrink: 0;
        }

        .piano-bed {
            position: relative;
            background: #05070a;
            padding: 0 2px 6px 2px;
            border-radius: 0 0 12px 12px;
            box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.9);
            flex: 1 1 auto;
            min-height: 350px;
            touch-action: none;
        }

        .piano-bed * { touch-action: none; }

        .key-white {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
            background: linear-gradient(180deg, #e2e8f0 0%, #ffffff 12%, #f8fafc 88%, #cbd5e1 100%);
            border: 1px solid #94a3b8;
            border-top: none;
            border-radius: 0 0 7px 7px;
            margin: 0 1px;
            cursor: pointer;
            transform-origin: top center;
            transition: transform 0.05s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.05s ease, background 0.06s ease;
            box-shadow: 0 5px 0 #94a3b8, 0 7px 10px rgba(0, 0, 0, 0.5), inset 0 -4px 6px rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 7px;
            z-index: 1;
        }

        .key-white:hover {
            background: linear-gradient(180deg, #f1f5f9 0%, #ffffff 15%, #f0f9ff 90%, #bae6fd 100%);
        }

        .key-white.guide-target {
            background: linear-gradient(180deg, #fef3c7 0%, #fde68a 35%, #fbbf24 90%, #f59e0b 100%) !important;
            border-color: #fbbf24 !important;
            box-shadow: 0 5px 0 #d97706, 0 0 22px rgba(251, 191, 36, 0.85), inset 0 -4px 8px rgba(255, 255, 255, 0.9) !important;
        }

        .key-white.active {
            transform: perspective(600px) rotateX(-3.5deg) translateY(4px);
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 25%, #7dd3fc 90%, #38bdf8 100%) !important;
            box-shadow: 0 2px 0 #0284c7, 0 0 22px rgba(56, 189, 248, 0.85), inset 0 2px 8px rgba(2, 132, 199, 0.35) !important;
            border-color: #38bdf8 !important;
        }

        .key-black {
            position: absolute;
            top: 0;
            height: 58%;
            background: linear-gradient(180deg, #334155 0%, #1e293b 15%, #0f172a 85%, #020617 100%);
            border: 1px solid #020617;
            border-top: none;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            transform-origin: top center;
            transition: transform 0.05s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.05s ease, background 0.06s ease;
            box-shadow: 0 4px 0 #020617, 0 7px 10px rgba(0, 0, 0, 0.75), inset 0 1px 2px rgba(255, 255, 255, 0.25), inset 0 -3px 4px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5px;
            z-index: 10;
        }

        .key-black:hover {
            background: linear-gradient(180deg, #475569 0%, #1e293b 20%, #0f172a 90%, #020617 100%);
        }

        .key-black.guide-target {
            background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 35%, #d97706 85%, #92400e 100%) !important;
            border-color: #fde68a !important;
            box-shadow: 0 4px 0 #78350f, 0 0 20px rgba(251, 191, 36, 0.95), inset 0 1px 4px rgba(255, 255, 255, 0.7) !important;
        }

        .key-black.active {
            transform: perspective(500px) rotateX(-4.5deg) translateY(3px);
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 30%, #0369a1 85%, #0c4a6e 100%) !important;
            box-shadow: 0 2px 0 #082f49, 0 0 20px rgba(56, 189, 248, 0.95), inset 0 1px 4px rgba(255, 255, 255, 0.6) !important;
            border-color: #7dd3fc !important;
        }

        /* 簡譜高低音點標示（緊湊行高） */
        .solfege-wrap {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            pointer-events: none;
        }
        .solfege-dot-top {
            height: 6px;
            font-size: 9px;
            line-height: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .solfege-dot-bottom {
            height: 6px;
            font-size: 9px;
            line-height: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .solfege-num {
            line-height: 1;
        }

        @media (min-width: 1024px) {
            .solfege-dot-top, .solfege-dot-bottom {
                height: 9px;
                font-size: 12px;
                line-height: 9px;
            }
        }

        /* 固定尺寸簡譜方框，轉換時不忽大忽小 */
        .sheet-note-box {
            flex: 0 0 auto;
            width: 50px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease, color 0.14s ease;
            cursor: pointer;
        }

        @media (min-width: 1024px) {
            .sheet-note-box {
                width: 66px;
                height: 58px;
            }
        }

        .guide-dot {
            display: none;
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            margin-bottom: 3px;
            animation: bounceDot 0.65s infinite alternate;
        }

        .guide-target .guide-dot { display: block; }

        @keyframes bounceDot {
            from { transform: translateY(0) scale(0.95); }
            to { transform: translateY(-4px) scale(1.15); }
        }

        .btn-glow-active {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
        }

        .btn-amber-active {
            background: linear-gradient(135deg, #d97706 0%, #ea580c 100%);
            color: #ffffff;
            border-color: #fbbf24;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
        }

        .no-scrollbar::-webkit-scrollbar { height: 4px; }
        .no-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

        input[type="range"] {
            -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; height: 20px; padding: 0;
        }
        input[type="range"]::-webkit-slider-runnable-track { height: 5px; background: #334155; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%;
            background: #38bdf8; margin-top: -5px; box-shadow: 0 0 8px rgba(56, 189, 248, 0.7); border: 2px solid #0f172a;
        }
        input[type="range"]::-moz-range-track { height: 5px; background: #334155; border-radius: 3px; }
        input[type="range"]::-moz-range-thumb {
            width: 15px; height: 15px; border-radius: 50%; background: #38bdf8; border: 2px solid #0f172a;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
        }

        /* 緊湊控制列字體與按鈕設定 */
        .compact-btn {
            font-size: 12px;
            line-height: 1.1;
            padding: 4px 7px;
            white-space: nowrap;
        }
        @media (min-width: 1024px) {
            .compact-btn {
                font-size: 14px;
                line-height: 1.2;
                padding: 6px 10px;
            }
        }

        .compact-select {
            font-size: 12px;
            line-height: 1.1;
            padding: 4px 6px;
            white-space: nowrap;
        }
        @media (min-width: 1024px) {
            .compact-select {
                font-size: 14px;
                line-height: 1.2;
                padding: 5px 10px;
            }
        }

        #portraitPromptModal.hidden-modal { display: none; }

        /* 放大整句歌詞點亮樣式 */
        .ktv-char {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 22px;
            line-height: 1.2;
            display: inline-block;
            transition: color 0.14s ease, transform 0.14s ease, text-shadow 0.14s ease;
            white-space: nowrap;
        }

        @media (min-width: 1024px) {
            .ktv-char { font-size: 30px; line-height: 1.25; }
        }

        .ktv-past { color: rgba(148, 163, 184, 0.45); }
        .ktv-upcoming { color: #f8fafc; }
        .ktv-active-char {
            color: #facc15;
            transform: translateY(-2px) scale(1.18);
            text-shadow: 0 0 14px rgba(250, 204, 21, 0.95), 0 0 24px rgba(251, 146, 60, 0.6);
        }

        /* 橫向與 LINE 內嵌瀏覽器緊湊高度保留充足琴鍵空間 */
        @media (orientation: landscape) and (max-height: 680px) {
            html, body { touch-action: none; overflow: hidden; }
            body {
                height: 100dvh; min-height: 100dvh;
                padding-top: max(2px, var(--safe-top));
                padding-bottom: max(2px, var(--safe-bottom));
                padding-left: max(2px, var(--safe-left));
                padding-right: max(2px, var(--safe-right));
            }
            main { flex: 1 1 auto; min-height: 0; width: 100%; max-width: none; display: flex; flex-direction: column; }
            .synth-chassis { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 10px; }
            header { display: none !important; }
            .control-panel-grid {
                display: grid !important;
                grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
                gap: 4px !important;
                padding: 3px 6px !important;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                flex-shrink: 0;
            }
            .control-panel-grid > :nth-child(1) { grid-column: span 5; padding: 2px 4px; }
            .control-panel-grid > :nth-child(2) { grid-column: span 7; min-height: 46px; }
            .control-panel-grid .ktv-char { font-size: 20px !important; line-height: 1.15 !important; }
            .tutor-bar { padding: 2px 6px !important; gap: 2px !important; flex-shrink: 0; }
            .tutor-bar .sheet-scroll-box { padding: 1px !important; }
            .tutor-bar .sheet-note-box { width: 42px; height: 36px; }
            .keys-section { flex: 1 1 auto; min-height: 215px; }
            .piano-bed { height: 100% !important; min-height: 215px; padding: 0 2px 3px 2px !important; border-radius: 0 0 8px 8px; }
            footer { display: none !important; }
        }

        @media (orientation: portrait) {
            .piano-bed { min-height: 360px; }
            footer { display: none !important; }
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <div id="lineBrowserBanner" class="hidden w-full mb-0.5 px-2.5 py-1 rounded-lg bg-amber-500/15 border border-amber-400/40 text-amber-200 text-xs flex items-center justify-between gap-2 shrink-0">
        <span class="truncate">⚠️ 建議用外部瀏覽器開啟，橫向與音效更順暢。</span>
        <button id="closeLineBannerBtn" class="text-amber-300 hover:text-white font-bold shrink-0 px-1">✕</button>
    </div>

    <div id="portraitPromptModal" class="hidden-modal fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 rounded-2xl bg-sky-500/15 border border-sky-400/40 flex items-center justify-center mb-4 animate-bounce">
            <svg class="w-9 h-9 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
        </div>
        <h2 class="text-xl font-black text-white mb-2">請把手機轉橫</h2>
        <p class="text-sm text-slate-300 max-w-xs leading-relaxed mb-5">
            請將手機轉為橫向以獲得更寬的琴鍵，系統已嘗試自動切換橫向顯示。
        </p>
        <button id="dismissPortraitModalBtn" class="py-2.5 px-6 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-700 whitespace-nowrap">
            開始彈奏
        </button>
    </div>

    <header class="w-full flex flex-wrap items-center justify-between gap-1.5 mb-1 px-1 sm:px-2 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center shadow-md shrink-0">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                </svg>
            </div>
            <div class="flex items-baseline gap-1.5">
                <h1 class="text-sm sm:text-lg font-black tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-sky-200 to-indigo-300 whitespace-nowrap">
                    For Winny電子琴
                </h1>
                <span class="text-[11px] text-slate-400 whitespace-nowrap">~by Dustin</span>
            </div>
        </div>

        <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-700/70 px-2.5 py-0.5 rounded-lg">
            <div class="flex items-center gap-1">
                <span class="text-xs text-slate-400 font-medium hidden sm:inline whitespace-nowrap">音量</span>
                <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.75" class="w-16 sm:w-24">
            </div>

            <span id="audioStatusBadge" class="hidden md:inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30 whitespace-nowrap">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                點擊琴鍵啟動音效
            </span>
        </div>
    </header>

    <main class="w-full flex-1 flex flex-col justify-start">
        <div class="synth-chassis rounded-2xl overflow-hidden flex flex-col flex-1">

            <div class="control-panel-grid grid grid-cols-1 lg:grid-cols-12 gap-1.5 p-1.5 sm:px-3 sm:py-2 border-b border-slate-800/90 bg-slate-900/60 shrink-0">

                <div class="lg:col-span-5 flex flex-col justify-center bg-slate-950/70 p-1 rounded-lg border border-slate-800">
                    <div class="grid grid-cols-4 lg:grid-cols-2 gap-1" id="presetButtons">
                        <button data-preset="grand" class="preset-btn btn-glow-active compact-btn rounded-lg border border-slate-700 font-bold transition-all flex items-center justify-center gap-1">
                            🎹 鋼琴
                        </button>
                        <button data-preset="epiano" class="preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-200 compact-btn rounded-lg border border-slate-700 font-bold transition-all flex items-center justify-center gap-1">
                            ✨ 電鋼琴
                        </button>
                        <button data-preset="organ" class="preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-200 compact-btn rounded-lg border border-slate-700 font-bold transition-all flex items-center justify-center gap-1">
                            ⛪ 管風琴
                        </button>
                        <button data-preset="retro8bit" class="preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-200 compact-btn rounded-lg border border-slate-700 font-bold transition-all flex items-center justify-center gap-1">
                            👾 8-Bit
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-7 relative rounded-lg overflow-hidden bg-[#04070d] border border-slate-700/80 shadow-inner min-h-[54px] sm:min-h-[72px] flex flex-col justify-between">
                    <canvas id="visualizerCanvas" class="absolute inset-0 w-full h-full block"></canvas>

                    <div class="relative z-10 flex items-center justify-between px-2.5 pt-0.5 pointer-events-none">
                        <span id="activeNotesDisplay" class="text-[11px] lg:text-xs font-mono-tech font-bold text-emerald-400">待機中</span>
                    </div>

                    <div id="ktvLyrics" class="relative z-10 flex-1 flex items-center justify-center overflow-x-auto no-scrollbar px-2 pb-0.5 min-h-[32px]">
                        <div id="ktvLine" class="flex items-center justify-center gap-0.5 whitespace-nowrap"></div>
                    </div>
                </div>
            </div>

            <div class="tutor-bar bg-slate-950/90 border-b border-slate-800 px-2 sm:px-3 py-1 flex flex-col gap-1 shrink-0">
                <div class="flex flex-wrap items-center justify-between gap-1">
                    <div class="flex flex-nowrap items-center gap-1 overflow-x-auto no-scrollbar">
                        <label for="songSelector" class="text-xs lg:text-sm font-bold text-sky-300 whitespace-nowrap shrink-0">琴譜：</label>
                        <select id="songSelector" class="bg-slate-900 border border-slate-700 text-slate-100 compact-select font-bold rounded-lg focus:outline-none focus:border-amber-400 cursor-pointer shrink-0">
                        </select>

                        <button id="toggleGuideBtn" class="btn-amber-active compact-btn font-bold rounded-lg border transition-all flex items-center gap-0.5 shrink-0">
                            💡 亮燈：開
                        </button>

                        <button id="demoPlayBtn" class="bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-600 compact-btn font-bold rounded-lg transition-all flex items-center gap-0.5 shrink-0">
                            ▶ 示範
                        </button>

                        <button id="resetSongBtn" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 compact-btn font-bold rounded-lg transition-all shrink-0">
                            ↺ 重來
                        </button>
                    </div>

                    <div class="flex items-center gap-1.5 text-xs lg:text-sm shrink-0">
                        <span id="tutorFeedbackText" class="text-amber-300 font-bold whitespace-nowrap">請按發黃光琴鍵</span>
                        <span id="songProgressBadge" class="font-mono-tech bg-slate-900 border border-slate-700 px-1.5 py-0.5 rounded text-slate-300 whitespace-nowrap">
                            0 / 0
                        </span>
                    </div>
                </div>

                <div class="sheet-scroll-box relative bg-slate-900/90 border border-slate-800 rounded-lg p-1 overflow-hidden">
                    <div class="absolute top-0 left-0 h-0.5 bg-slate-800 w-full">
                        <div id="songProgressBar" class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-200" style="width: 0%;"></div>
                    </div>

                    <div id="sheetNotesTrack" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5 px-0.5 scroll-smooth">
                    </div>
                </div>
            </div>

            <div class="felt-strip w-full"></div>

            <div class="keys-section flex flex-1 w-full items-stretch bg-[#070a10]">
                <div class="hidden md:block w-3 wood-trim border-r border-black/80 shrink-0"></div>

                <div class="flex-1 w-full flex flex-col">
                    <div id="pianoWrapper" class="piano-bed w-full select-none">
                        <div id="pianoKeysContainer" class="relative w-full h-full flex">
                        </div>
                    </div>
                </div>

                <div class="hidden md:block w-3 wood-trim border-l border-black/80 shrink-0"></div>
            </div>
        </div>

        function buildSemanticPhrases(song) {
            if (!song || !Array.isArray(song.notes)) return [];
            const noteCharEntries = [];
            song.notes.forEach((item, idx) => {
                if (item.l && item.l !== '—') {
                    noteCharEntries.push({ index: idx, char: item.l });
                }
            });
            if (noteCharEntries.length === 0) return [];
            if (!Array.isArray(song.phrases) || song.phrases.length === 0) return [noteCharEntries];

            const result = [];
            let cursor = 0;
            song.phrases.forEach(phraseStr => {
                const charsOnly = [...phraseStr].filter(ch => ch !== ' ');
                if (charsOnly.length === 0) return;
                const segment = [];
                for (let i = 0; i < charsOnly.length && cursor < noteCharEntries.length; i++) {
                    segment.push({ index: noteCharEntries[cursor].index, char: charsOnly[i] });
                    cursor++;
                }
                if (segment.length > 0) result.push(segment);
            });
            if (cursor < noteCharEntries.length) {
                const rest = noteCharEntries.slice(cursor);
                if (result.length > 0) result[result.length - 1] = result[result.length - 1].concat(rest);
                else result.push(rest);
            }
            return result;
        }

        const NOTE_NAME_TO_DEF = new Map();

        const TONE_PRESETS = {
            grand: { attack: 0.012, decay: 0.45, sustain: 0.25, release: 0.65 },
            epiano: { attack: 0.015, decay: 0.6, sustain: 0.35, release: 0.8 },
            organ: { attack: 0.04, decay: 0.1, sustain: 0.85, release: 0.25 },
            retro8bit: { attack: 0.005, decay: 0.2, sustain: 0.5, release: 0.18 }
        };

        const state = {
            audioCtx: null, masterGain: null, analyser: null, compressor: null,
            currentPreset: 'grand',
            activeVoices: new Map(), pressedKeyboardCodes: new Set(),
            activePointers: new Map(), particles: [], dismissedPortraitModal: false,
            tutorEnabled: true, currentSongIndex: 0, currentNoteIndex: 0, isDemoPlaying: false, demoTimers: []

        const keyElementsMap = new Map();

        function syncActiveKeys() {
            keyElementsMap.forEach((el, midi) => {
                if (state.activeVoices.has(midi)) el.classList.add('active');
                else el.classList.remove('active');

            updateActiveNotesDisplay();

        function initAudioEngine() {
            if (!state.audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                state.audioCtx = new AudioContextClass();
                state.compressor = state.audioCtx.createDynamicsCompressor();
                state.compressor.threshold.setValueAtTime(-16, state.audioCtx.currentTime);
                state.compressor.knee.setValueAtTime(20, state.audioCtx.currentTime);
                state.compressor.ratio.setValueAtTime(6, state.audioCtx.currentTime);
                state.compressor.attack.setValueAtTime(0.005, state.audioCtx.currentTime);
                state.compressor.release.setValueAtTime(0.25, state.audioCtx.currentTime);
                state.masterGain = state.audioCtx.createGain();
                state.masterGain.gain.setValueAtTime(parseFloat(document.getElementById('masterVolume').value), state.audioCtx.currentTime);
                state.analyser = state.audioCtx.createAnalyser();
                state.analyser.fftSize = 256;
                state.analyser.smoothingTimeConstant = 0.82;
                state.compressor.connect(state.masterGain);
                state.masterGain.connect(state.analyser);
                state.analyser.connect(state.audioCtx.destination);
            }
            if (state.audioCtx.state === 'suspended') state.audioCtx.resume().catch(() => {});
            const badge = document.getElementById('audioStatusBadge');
            if (badge) {
                badge.className = 'hidden md:inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 whitespace-nowrap';
                badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span>音效已就緒';
            }
        }

        function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

        function noteOn(baseMidi, isDemoTrigger = false) {
            try {
                initAudioEngine();
                const ctx = state.audioCtx;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                const now = ctx.currentTime;
                if (state.activeVoices.has(baseMidi)) forceStopVoice(baseMidi, 0.03);
                const freq = midiToFreq(baseMidi);
                const preset = TONE_PRESETS[state.currentPreset];
                const envGain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                const oscillators = [];

                if (state.currentPreset === 'grand') {
                    const osc1 = ctx.createOscillator(), osc2 = ctx.createOscillator(), osc3 = ctx.createOscillator(), g2 = ctx.createGain(), g3 = ctx.createGain();
                    osc1.type = 'triangle'; osc1.frequency.setValueAtTime(freq, now);
                    osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2, now); g2.gain.setValueAtTime(0.28, now);
                    osc3.type = 'sine'; osc3.frequency.setValueAtTime(freq * 3, now); g3.gain.setValueAtTime(0.08, now);
                    filter.frequency.setValueAtTime(Math.min(freq * 7, 9500), now);
                    filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.8, 320), now + 1.4);
                    osc1.connect(filter); osc2.connect(g2); g2.connect(filter); osc3.connect(g3); g3.connect(filter);
                    oscillators.push(osc1, osc2, osc3);
                } else if (state.currentPreset === 'epiano') {
                    const osc1 = ctx.createOscillator(), osc2 = ctx.createOscillator(), oscBell = ctx.createOscillator(), bellGain = ctx.createGain();
                    osc1.type = 'sine'; osc1.frequency.setValueAtTime(freq, now);
                    osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq, now); osc2.detune.setValueAtTime(6, now);
                    oscBell.type = 'sine'; oscBell.frequency.setValueAtTime(freq * 4, now);
                    bellGain.gain.setValueAtTime(0.22, now); bellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    filter.frequency.setValueAtTime(4200, now);
                    osc1.connect(filter); osc2.connect(filter); oscBell.connect(bellGain); bellGain.connect(filter);
                    oscillators.push(osc1, osc2, oscBell);
                } else if (state.currentPreset === 'organ') {
                    const ratios = [0.5, 1, 2, 3], volumes = [0.35, 0.5, 0.3, 0.15];
                    filter.frequency.setValueAtTime(3600, now);
                    ratios.forEach((ratio, idx) => {
                        const osc = ctx.createOscillator(), subGain = ctx.createGain();
                        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq * ratio, now);
                        subGain.gain.setValueAtTime(volumes[idx], now);
                        osc.connect(subGain); subGain.connect(filter);
                        oscillators.push(osc);
                    });
                } else if (state.currentPreset === 'retro8bit') {
                    const osc1 = ctx.createOscillator(), osc2 = ctx.createOscillator(), g2 = ctx.createGain();
                    osc1.type = 'square'; osc1.frequency.setValueAtTime(freq, now);
                    osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(freq * 0.5, now);
                    g2.gain.setValueAtTime(0.35, now); filter.frequency.setValueAtTime(5500, now);
                    osc1.connect(filter); osc2.connect(g2); g2.connect(filter);
                    oscillators.push(osc1, osc2);
                }

                filter.connect(envGain); envGain.connect(state.compressor);
                const peakGain = 0.34;
                envGain.gain.setValueAtTime(0.0001, now);
                envGain.gain.linearRampToValueAtTime(peakGain, now + preset.attack);
                envGain.gain.exponentialRampToValueAtTime(Math.max(peakGain * preset.sustain, 0.001), now + preset.attack + preset.decay);
                oscillators.forEach(osc => osc.start(now));

                state.activeVoices.set(baseMidi, { oscillators, envGain, actualMidi: baseMidi });
                syncActiveKeys();
                spawnNoteParticles(baseMidi);
                if (!isDemoTrigger && state.tutorEnabled && !state.isDemoPlaying) checkTutorStep(baseMidi);
            } catch (err) { console.error('音訊播放發生錯誤:', err); }
        }

        function noteOff(baseMidi) {
            if (!state.activeVoices.has(baseMidi)) { syncActiveKeys(); return; }
            forceStopVoice(baseMidi, TONE_PRESETS[state.currentPreset].release);
            syncActiveKeys();
        }

        function forceStopVoice(baseMidi, releaseTime) {
            const voice = state.activeVoices.get(baseMidi);
            if (!voice || !state.audioCtx) return;
            const ctx = state.audioCtx, now = ctx.currentTime;
            try {
                voice.envGain.gain.cancelScheduledValues(now);
                voice.envGain.gain.setValueAtTime(Math.max(voice.envGain.gain.value, 0.0001), now);
                voice.envGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);
                voice.oscillators.forEach(osc => osc.stop(now + releaseTime + 0.02));
            } catch (e) {}
            state.activeVoices.delete(baseMidi);
        }

        function initTutorSystem() {
            const selector = document.getElementById('songSelector');
            selector.innerHTML = '';
            SONG_LIBRARY.forEach((song, idx) => {
                const opt = document.createElement('option');

            selector.addEventListener('change', (e) => {

        function renderSheetTrack() {
            const track = document.getElementById('sheetNotesTrack');
            const song = SONG_LIBRARY[state.currentSongIndex];
            track.innerHTML = '';
            song.notes.forEach((item, idx) => {
                const card = document.createElement('div');
                card.id = `sheet-note-${idx}`;
                card.className = 'sheet-note-box border';
                card.addEventListener('click', () => {
                    stopDemoPlayback(); state.currentNoteIndex = idx; updateSheetTrackUI(); highlightCurrentGuideKey();
                });
                card.innerHTML = formatSolfegeHtml(item.s, 'text-sm sm:text-base lg:text-xl font-mono-tech font-black');
                track.appendChild(card);
            });
            updateSheetTrackUI();
        }

        function updateSheetTrackUI() {
            const song = SONG_LIBRARY[state.currentSongIndex];
            const total = song.notes.length;
            const current = state.currentNoteIndex;
            document.getElementById('songProgressBadge').textContent = `${Math.min(current, total)} / ${total}`;
            document.getElementById('songProgressBar').style.width = `${total > 0 ? (Math.min(current, total) / total) * 100 : 0}%`;
            for (let i = 0; i < total; i++) {
                const card = document.getElementById(`sheet-note-${i}`);
                if (!card) continue;
                if (i < current) {
                    card.className = 'sheet-note-box border border-emerald-500/30 bg-emerald-950/30 text-emerald-400/70';
                } else if (i === current) {
                    card.className = 'sheet-note-box border-2 border-amber-400 bg-amber-500/20 text-amber-200 shadow-[0_0_12px_rgba(251,191,36,0.35)]';
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    card.className = 'sheet-note-box border border-slate-800 bg-slate-950/80 text-slate-200 hover:border-slate-600';
                }
            }
            renderKtvLyrics();
        }

        function highlightCurrentGuideKey() {
            keyElementsMap.forEach(el => el.classList.remove('guide-target'));
            const feedbackEl = document.getElementById('tutorFeedbackText');
            if (!state.tutorEnabled) {
                feedbackEl.textContent = '自由彈奏';
                feedbackEl.className = 'text-slate-400 font-medium whitespace-nowrap';
                return;
            }
            const song = SONG_LIBRARY[state.currentSongIndex];
            if (state.currentNoteIndex >= song.notes.length) {
                feedbackEl.textContent = '🎉 恭喜完成！';
                feedbackEl.className = 'text-emerald-400 font-bold whitespace-nowrap';
                return;
            }
            const targetNoteObj = song.notes[state.currentNoteIndex];
            const keyDef = NOTE_NAME_TO_DEF.get(targetNoteObj.n);
            if (keyDef) {
                const keyEl = keyElementsMap.get(keyDef.midi);
                if (keyEl) keyEl.classList.add('guide-target');
                feedbackEl.textContent = `按黃光鍵 ${targetNoteObj.s}`;
                feedbackEl.className = 'text-amber-300 font-bold whitespace-nowrap';
            }
        }

        function checkTutorStep(pressedMidi) {
            const song = SONG_LIBRARY[state.currentSongIndex];
            if (state.currentNoteIndex >= song.notes.length) return;
            const targetNoteObj = song.notes[state.currentNoteIndex];
            const targetDef = NOTE_NAME_TO_DEF.get(targetNoteObj.n);
            if (targetDef && pressedMidi === targetDef.midi) {
                state.currentNoteIndex++; updateSheetTrackUI(); highlightCurrentGuideKey();
            } else {
                const feedbackEl = document.getElementById('tutorFeedbackText');
                feedbackEl.textContent = `找黃光鍵 ${targetNoteObj.s}`;
                feedbackEl.className = 'text-rose-400 font-bold whitespace-nowrap';
            }
        }

        function startDemoPlayback() {
            stopDemoPlayback();
            initAudioEngine();
            const song = SONG_LIBRARY[state.currentSongIndex];
            if (state.currentNoteIndex >= song.notes.length) state.currentNoteIndex = 0;
            state.isDemoPlaying = true;
            const demoBtn = document.getElementById('demoPlayBtn');
            demoBtn.className = 'bg-rose-600 hover:bg-rose-500 text-white border border-rose-400 compact-btn font-bold rounded-lg transition-all flex items-center gap-0.5 shrink-0 shadow-[0_0_12px_rgba(225,29,72,0.45)]';
            demoBtn.textContent = '⏹ 停止';
            const beatMs = (60 / song.tempo) * 1000;
            let accumulatedDelay = 0;
            for (let i = state.currentNoteIndex; i < song.notes.length; i++) {
                const noteItem = song.notes[i], keyDef = NOTE_NAME_TO_DEF.get(noteItem.n), durationMs = noteItem.d * beatMs;
                const startTimer = setTimeout(() => {
                    if (!state.isDemoPlaying) return;
                    state.currentNoteIndex = i; updateSheetTrackUI(); highlightCurrentGuideKey();
                    if (keyDef) {
                        noteOn(keyDef.midi, true);
                        const stopTimer = setTimeout(() => { noteOff(keyDef.midi); }, durationMs * 0.85);
                        state.demoTimers.push(stopTimer);
                    }
                }, accumulatedDelay);
                state.demoTimers.push(startTimer); accumulatedDelay += durationMs;
            }
            const endTimer = setTimeout(() => {
                state.currentNoteIndex = song.notes.length; updateSheetTrackUI(); highlightCurrentGuideKey();
                stopDemoPlayback(false);
            }, accumulatedDelay + 150);
            state.demoTimers.push(endTimer);
        }

        function stopDemoPlayback(resetFeedback = true) {
            state.isDemoPlaying = false;
            state.demoTimers.forEach(t => clearTimeout(t)); state.demoTimers = [];
            keyElementsMap.forEach((_, midi) => noteOff(midi));
            const demoBtn = document.getElementById('demoPlayBtn');
            demoBtn.className = 'bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-600 compact-btn font-bold rounded-lg transition-all flex items-center gap-0.5 shrink-0';
            demoBtn.textContent = '▶ 示範';
            if (resetFeedback) highlightCurrentGuideKey();
        }

        function renderKtvLyrics() {
            const lineEl = document.getElementById('ktvLine');
            if (!lineEl) return;

            const song = SONG_LIBRARY[state.currentSongIndex];
            const phrases = buildSemanticPhrases(song);
            if (phrases.length === 0) {
                lineEl.innerHTML = '<span class="ktv-char ktv-upcoming">♪ 跟彈簡譜練習 ♪</span>';
                return;
            }

            const curNoteIdx = state.currentNoteIndex;
            if (curNoteIdx >= song.notes.length) {
                lineEl.innerHTML = '<span class="ktv-char ktv-active-char">🎉 整首完成！</span>';
                return;
            }

            let activePhrase = phrases.find(p => curNoteIdx >= p[0].index && curNoteIdx <= p[p.length - 1].index);
            if (!activePhrase) {
                const prevPhrase = [...phrases].reverse().find(p => p[p.length - 1].index < curNoteIdx);
                activePhrase = prevPhrase || phrases[0];
            }

            let highlightIdx = -1;
            const exactMatch = activePhrase.find(item => item.index === curNoteIdx);
            if (exactMatch) {
                highlightIdx = exactMatch.index;
            } else {
                const nextInPhrase = activePhrase.find(item => item.index > curNoteIdx);
                highlightIdx = nextInPhrase ? nextInPhrase.index : activePhrase[activePhrase.length - 1].index;
            }

            const frag = document.createDocumentFragment();
            activePhrase.forEach(item => {
                const span = document.createElement('span');
                span.className = 'ktv-char';
                span.textContent = item.char;
                if (item.index < highlightIdx) span.classList.add('ktv-past');
                else if (item.index === highlightIdx) span.classList.add('ktv-active-char');
                else span.classList.add('ktv-upcoming');
                frag.appendChild(span);
            });

            lineEl.innerHTML = '';
            lineEl.appendChild(frag);
        }

        function buildPianoKeyboard() {
            const container = document.getElementById('pianoKeysContainer');
            container.innerHTML = ''; keyElementsMap.clear();
            const whiteKeys = KEY_DEFINITIONS.filter(k => k.type === 'white');
            const totalWhites = whiteKeys.length, whiteWidthPercent = 100 / totalWhites;
            whiteKeys.forEach((keyDef) => {
                const keyEl = document.createElement('div');
                keyEl.className = 'key-white';
                keyEl.dataset.midi = keyDef.midi;
                keyEl.innerHTML = `
                    <span class="guide-dot"></span>
                    ${formatSolfegeHtml(keyDef.solfege, 'text-[11px] sm:text-sm lg:text-lg font-mono-tech font-black text-slate-800')}
                `;
                container.appendChild(keyEl); keyElementsMap.set(keyDef.midi, keyEl);
            });
            let whiteIndexCounter = 0;
            KEY_DEFINITIONS.forEach((keyDef) => {
                if (keyDef.type === 'white') { whiteIndexCounter++; }
                else {
                    const keyEl = document.createElement('div');
                    keyEl.className = 'key-black';
                    keyEl.dataset.midi = keyDef.midi;
                    const blackWidthPercent = whiteWidthPercent * 0.62;
                    const leftPercent = (whiteIndexCounter * whiteWidthPercent) - (blackWidthPercent / 2);
                    keyEl.style.width = `${blackWidthPercent}%`; keyEl.style.left = `${leftPercent}%`;
                    keyEl.innerHTML = `
                        <span class="guide-dot"></span>
                        ${formatSolfegeHtml(keyDef.solfege, 'text-[9px] sm:text-[11px] lg:text-sm font-mono-tech font-bold text-slate-100')}
                    `;
                    container.appendChild(keyEl); keyElementsMap.set(keyDef.midi, keyEl);
                }
            });
            highlightCurrentGuideKey();
        }

        function setupPointerInteractions() {
            const container = document.getElementById('pianoKeysContainer');
            function getMidiAtPoint(clientX, clientY) {
                const target = document.elementFromPoint(clientX, clientY);
                if (!target) return null;
                const keyEl = target.closest('[data-midi]');
                if (!keyEl || !container.contains(keyEl)) return null;
                return parseInt(keyEl.dataset.midi, 10);
            }
            container.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                tryAutoLandscape();
                if (state.isDemoPlaying) stopDemoPlayback();
                const midi = getMidiAtPoint(e.clientX, e.clientY);
                state.activePointers.set(e.pointerId, { midi, x: e.clientX });
                if (midi !== null) noteOn(midi);
            });
            container.addEventListener('pointermove', (e) => {
                if (!state.activePointers.has(e.pointerId)) return;
                e.preventDefault();
                const prevInfo = state.activePointers.get(e.pointerId);
                const prevMidi = prevInfo.midi;
                const currentMidi = getMidiAtPoint(e.clientX, e.clientY);
                if (currentMidi !== prevMidi) {
                    if (prevMidi !== null) {
                        let stillHeldByOther = false;
                        state.activePointers.forEach((info, pid) => { if (pid !== e.pointerId && info.midi === prevMidi) stillHeldByOther = true; });
                        if (!stillHeldByOther) noteOff(prevMidi);
                    }
                    state.activePointers.set(e.pointerId, { midi: currentMidi, x: e.clientX });
                    if (currentMidi !== null) noteOn(currentMidi);
                }
            });
            const handlePointerEnd = (e) => {
                if (!state.activePointers.has(e.pointerId)) return;
                const prevInfo = state.activePointers.get(e.pointerId);
                const prevMidi = prevInfo.midi;
                state.activePointers.delete(e.pointerId);
                if (prevMidi !== null) {
                    let stillHeldByOther = false;
                    state.activePointers.forEach((info) => { if (info.midi === prevMidi) stillHeldByOther = true; });
                    if (!stillHeldByOther) noteOff(prevMidi);
                }
            };
            window.addEventListener('pointerup', handlePointerEnd);
            window.addEventListener('pointercancel', handlePointerEnd);
        }

        function setupKeyboardAndControls() {
            const keyCodeToMidi = new Map();
            KEY_DEFINITIONS.forEach(k => keyCodeToMidi.set(k.keyCode, k.midi));
            function isTypingTarget(el) { return el && (['INPUT', 'TEXTAREA', 'SELECT'].includes((el.tagName || '').toUpperCase()) || el.isContentEditable); }
            window.addEventListener('keydown', (e) => {
                if (e.repeat || isTypingTarget(e.target)) return;
                if (keyCodeToMidi.has(e.code)) {
                    e.preventDefault();
                    if (state.isDemoPlaying) stopDemoPlayback();
                    state.pressedKeyboardCodes.add(e.code); noteOn(keyCodeToMidi.get(e.code));
                }
            });
            window.addEventListener('keyup', (e) => {
                if (isTypingTarget(e.target)) return;
                if (keyCodeToMidi.has(e.code)) {
                    state.pressedKeyboardCodes.delete(e.code); noteOff(keyCodeToMidi.get(e.code));
                }
            });
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const presetKey = btn.dataset.preset; state.currentPreset = presetKey;
                    document.querySelectorAll('.preset-btn').forEach(b => { b.classList.remove('btn-glow-active'); b.classList.add('bg-slate-800/80', 'text-slate-200'); });
                    btn.classList.add('btn-glow-active'); btn.classList.remove('bg-slate-800/80', 'text-slate-200');
                });
            });
            document.getElementById('masterVolume').addEventListener('input', (e) => {
                if (state.masterGain) state.masterGain.gain.setValueAtTime(parseFloat(e.target.value), state.audioCtx.currentTime);
            });
        }

        function updateActiveNotesDisplay() {
            const el = document.getElementById('activeNotesDisplay');
            if (!el) return;
            if (state.activeVoices.size === 0) {
                el.textContent = '待機中';
                el.className = 'text-[11px] lg:text-xs font-mono-tech font-bold text-slate-500';
                return;
            }
            const sols = Array.from(state.activeVoices.keys()).map(midi => {
                const found = KEY_DEFINITIONS.find(k => k.midi === midi);
                return found ? found.solfege : '';
            }).filter(Boolean);
            el.textContent = sols.join(' ') || '待機中';
            el.className = 'text-[11px] lg:text-xs font-mono-tech font-bold text-emerald-400';
        }

        function spawnNoteParticles() {
            const canvas = document.getElementById('visualizerCanvas');
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0) return;
            const x = rect.width * 0.15 + Math.random() * rect.width * 0.7;
            const color = 'rgba(56,189,248,';
            for (let i = 0; i < 6; i++) {
                state.particles.push({
                    x, y: rect.height * 0.7 + Math.random() * 20,
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: -Math.random() * 2.5 - 1,
                    life: 1, decay: 0.008 + Math.random() * 0.012,
                    color, size: 2 + Math.random() * 4
                });
            }
        }

        function initVisualizer() {
            const canvas = document.getElementById('visualizerCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * (window.devicePixelRatio || 1);
                canvas.height = rect.height * (window.devicePixelRatio || 1);
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            function draw() {
                requestAnimationFrame(draw);
                const w = canvas.width / (window.devicePixelRatio || 1);
                const h = canvas.height / (window.devicePixelRatio || 1);
                ctx.clearRect(0, 0, w, h);

                if (state.analyser) {
                    const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                    state.analyser.getByteFrequencyData(dataArray);
                    const barWidth = w / dataArray.length * 1.5;
                    for (let i = 0; i < dataArray.length; i++) {
                        const barHeight = (dataArray[i] / 255) * h * 0.6;
                        const hue = 200 + (i / dataArray.length) * 60;
                        ctx.fillStyle = `hsla(${hue}, 90%, 60%, 0.35)`;
                        ctx.fillRect(i * barWidth, h - barHeight, barWidth * 0.85, barHeight);
                    }
                }

                state.particles = state.particles.filter(p => p.life > 0);
                state.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    p.vy += 0.03; p.life -= p.decay;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + Math.max(0, p.life).toFixed(2) + ')';
                    ctx.fill();
                });
            }
            draw();
        }

        function isMobilePhone() {
            return /Android|iPhone|iPod|SM-|Galaxy/i.test(navigator.userAgent);
        }

        function tryAutoLandscape() {
            try {
                if (screen && screen.orientation && typeof screen.orientation.lock === 'function') {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {}
        }

        function init() {
            buildPianoKeyboard();
            setupPointerInteractions();
            setupKeyboardAndControls();
            initTutorSystem();
            initVisualizer();
            tryAutoLandscape();

            document.getElementById('dismissPortraitModalBtn')?.addEventListener('click', () => {
                tryAutoLandscape();
                document.getElementById('portraitPromptModal').classList.add('hidden-modal');
                state.dismissedPortraitModal = true;
            });

            function checkOrientation() {
                tryAutoLandscape();
                const isPortrait = window.innerHeight > window.innerWidth;
                if ((isPortrait || isMobilePhone()) && !state.dismissedPortraitModal && isPortrait) {
                    document.getElementById('portraitPromptModal').classList.remove('hidden-modal');
                } else if (!isPortrait) {
                    document.getElementById('portraitPromptModal').classList.add('hidden-modal');
                }
            }

            if (isMobilePhone() && window.innerHeight > window.innerWidth) {
                document.getElementById('portraitPromptModal').classList.remove('hidden-modal');
            }

            window.addEventListener('resize', checkOrientation);
            window.addEventListener('orientationchange', checkOrientation);
            setTimeout(checkOrientation, 250);

            if (/Line/i.test(navigator.userAgent)) {
                document.getElementById('lineBrowserBanner')?.classList.remove('hidden');
            }
            document.getElementById('closeLineBannerBtn')?.addEventListener('click', () => {
                document.getElementById('lineBrowserBanner').classList.add('hidden');
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
